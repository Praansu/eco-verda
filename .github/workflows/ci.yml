name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check .

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "test-secret-for-ci"
          NEXTAUTH_URL: "http://localhost:3000"
          STRIPE_SECRET_KEY: "sk_test_ci"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci"

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t eco-verda .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 3000:3000 \
            -e DATABASE_URL="file:./dev.db" \
            -e NEXTAUTH_SECRET="test-secret" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e STRIPE_SECRET_KEY="sk_test_ci" \
            -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="pk_test_ci" \
            eco-verda
          sleep 15
          curl -f http://localhost:3000 || (docker logs test-container && exit 1)
          docker stop test-container