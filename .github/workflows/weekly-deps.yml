name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check for outdated packages
        id: outdated
        run: |
          outdated=$(npm outdated --json 2>/dev/null || echo '{}')
          count=$(echo "$outdated" | jq 'length')
          echo "outdated=$outdated" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT
      - name: Create PR with updates
        if: steps.outdated.outputs.count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="deps/update-$(date +%Y%m%d)"
          git checkout -b "$branch"
          npm update --save
          git add package.json package-lock.json
          git commit -m "deps: weekly dependency updates $(date +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create \
            --title "deps: weekly dependency updates $(date +%Y-%m-%d)" \
            --body "Automated weekly dependency update. Review changes and merge if tests pass." \
            --label "dependencies,automated" \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}