name: Nightly Test Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: test
        run: |
          if [ -f "jest.config.js" ] || [ -f "jest.config.ts" ] || grep -q '"test"' package.json; then
            npm test 2>&1 | tee test-output.txt
            exit_code=${PIPESTATUS[0]}
          else
            echo "No test script found, creating placeholder test..."
            mkdir -p src/__tests__
            cat > src/__tests__/placeholder.test.ts << 'EOF'
test('placeholder', () => {
  expect(true).toBe(true);
});
EOF
            npx jest src/__tests__/placeholder.test.ts --passWithNoTests 2>&1 | tee test-output.txt
            exit_code=0
          fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
      - name: Create issue on test failure
        if: steps.test.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('test-output.txt', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Nightly Tests Failed - ${today}`,
              body: `## Nightly Test Failure\n\n**Date:** ${today}\n\n**Output:**\n\`\`\`\n${output.slice(-3000)}\n\`\`\`\n\n---\n*Auto-generated from nightly test run.*`,
              labels: ['test-failure', 'nightly', 'bug']
            });